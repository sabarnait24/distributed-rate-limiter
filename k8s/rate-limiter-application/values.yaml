replicaCount: 2

image:
  repository: rate-limiter-app
  tag: "1.0.4"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080


resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"


probes:
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 5

  liveness:
    initialDelaySeconds: 20
    periodSeconds: 10

env:
  SPRING_DATASOURCE_URL: "jdbc:mysql://host.minikube.internal:3306/ratelimit"
  SPRING_DATASOURCE_USERNAME: "root"
  SPRING_REDIS_HOST: "host.minikube.internal"
  SPRING_REDIS_PORT: "6379"
  RATELIMIT_REFRESH_MS: "600000"
  JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"

secret:
  SPRING_DATASOURCE_PASSWORD: "mysql123"